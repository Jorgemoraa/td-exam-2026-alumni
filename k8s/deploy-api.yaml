apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploy-api
  template:
    metadata:
      labels:
        app: deploy-api
    spec:
      containers:
        - name: api-gw
          image: gcr.io/aesthetic-vent-494006-g0/api-gw:latest
          ports:
            - containerPort: 3000
